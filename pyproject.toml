[project]
name = "palimpsa"
version = "0.1.0"
description = "Research code: SymA (exact-match-length bias + forget gate, no positional encoding) vs a Llama-style baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy"]

[project.optional-dependencies]
data = ["pyarrow", "tokenizers", "huggingface_hub"]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: trains a tiny model for a few hundred steps"]
